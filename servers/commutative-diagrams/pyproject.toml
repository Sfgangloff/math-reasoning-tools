[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "math-commutative-diagrams-mcp"
version = "0.1.0"
description = "MCP server for rendering commutative diagrams: tikz-cd, Quiver, and a simple DSL"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
latex = ["pdf2image>=1.17"]  # requires pdflatex + poppler installed separately

[project.scripts]
math-commutative-diagrams-mcp = "math_commutative_diagrams.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/math_commutative_diagrams"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "math-search-mcp"
version = "0.1.0"
description = "MCP server for mathematical knowledge search: ArXiv, MathWorld, Wikipedia, OEIS, zbMATH"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
math-search-mcp = "math_search.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["src/math_search"]

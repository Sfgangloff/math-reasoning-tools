[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "math-viz-mcp"
version = "0.1.0"
description = "MCP server for mathematical visualization: function plots, graphs, posets, LaTeX rendering"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "numpy>=1.26",
    "scipy>=1.13",
    "sympy>=1.13",
    "pillow>=10.0",
]

[project.scripts]
math-viz-mcp = "math_viz.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/math_viz"]

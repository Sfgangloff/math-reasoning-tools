[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "math-compute-mcp"
version = "0.1.0"
description = "MCP server for sandboxed symbolic computation: SymPy, Z3, OEIS, batch examples"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0",
    "sympy>=1.13",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
z3 = ["z3-solver>=4.13"]   # optional: install when z3 builds on your Python version
sage = []                   # SageMath installed separately via sage binary

[project.scripts]
math-compute-mcp = "math_compute.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/math_compute"]

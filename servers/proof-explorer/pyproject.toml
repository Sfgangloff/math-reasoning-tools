[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "math-proof-explorer-mcp"
version = "0.1.0"
description = "MCP server for Lean4 proof visualization: proof tree, goal explanation, sorry map"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
math-proof-explorer-mcp = "math_proof_explorer.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/math_proof_explorer"]
